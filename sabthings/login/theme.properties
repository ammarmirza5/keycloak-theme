# Sabthings ID — Keycloak login theme
# Inherits everything from keycloak.v2 and overrides only the bits we care about.
#
# When you change this file, restart the Keycloak container for it to pick up.
# When you change CSS/images only, no restart needed — the asset URL is hashed
# but the browser cache may need a hard reload.

parent=keycloak.v2
import=common/keycloak

styles=css/sabthings.css

# Clicking the logo at the top of the login card goes here
kcLogoLink=https://sabthings.com

# Disable the language selector dropdown unless you've added more locales below
# locales=en,ur
