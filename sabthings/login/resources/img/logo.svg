<?xml version="1.0" encoding="UTF-8"?>
<!-- Sabthings ID — placeholder wordmark. Replace with the official Sabthings logo when ready.
     Keep the viewBox roughly 320x64 so the CSS sizing in sabthings.css stays correct. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="sb-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Mark: rounded square with stylized "S" -->
  <g transform="translate(8, 8)">
    <rect width="48" height="48" rx="12" fill="url(#sb-grad)"/>
    <path d="M16 18c0-3 2.5-5 6-5h6c3.5 0 6 2 6 5 0 3-2.5 4.5-6 4.5h-6c-3.5 0-6 1.5-6 4.5 0 3 2.5 5 6 5h6c3.5 0 6-2 6-5"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="68" y="32" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="700" fill="#0f172a" dominant-baseline="middle">
    Sabthings
  </text>
  <text x="68" y="50" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="11" font-weight="500" letter-spacing="0.18em" fill="#64748b" dominant-baseline="middle">
    I D
  </text>
</svg>
